name: CI/CD

on:
  push:
    branches: [master]
    # Mexer só em documentação não reinicia o app em produção.
    paths-ignore: ['**.md']
  # Também dispara a mão, para publicar quando só o front (outro repositório) mudou: gh workflow run deploy.yml
  workflow_dispatch:

# Uma esteira por vez: a que está rodando termina antes da próxima começar.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/samuelmsilva2v/trainingapp-app

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Os dois repositórios lado a lado, como o Dockerfile espera.
      - uses: actions/checkout@v7
        with:
          path: trainingapp-api
      - uses: actions/checkout@v7
        with:
          repository: samuelmsilva2v/trainingapp-web
          path: trainingapp-web
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: trainingapp-api/pom.xml
      # O Docker do runner roda também os testes com Postgres (Testcontainers), que no PC são ignorados sem Docker.
      - name: Testes da API
        working-directory: trainingapp-api
        run: ./mvnw -B verify
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trainingapp-web/package-lock.json
      - name: Testes do front
        working-directory: trainingapp-web
        run: |
          npm ci
          npx ng test --watch=false

  publicar:
    needs: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: trainingapp-api
      - uses: actions/checkout@v7
        with:
          repository: samuelmsilva2v/trainingapp-web
          path: trainingapp-web
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A VM é x86_64, o mesmo do runner. Se a VPS nova for ARM, trocar a plataforma aqui.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: trainingapp-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  implantar:
    needs: publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      VM_DESTINO: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
      URL: https://apptraining.duckdns.org
    steps:
      # A chave só deixa a VM rodar o ~/trainingapp/deploy.sh (pull da imagem e recriar o app), seja qual for o comando.
      - name: Implantar na VM
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "$VM_DESTINO" deploy
      # O app leva cerca de 1 min para subir (VM pequena); o Caddy responde 502 até lá.
      - name: Teste de fumaça
        run: |
          for i in $(seq 1 36); do
            curl -fsS --max-time 5 "$URL/api/auth/config" && exit 0
            sleep 5
          done
          echo "O app não respondeu em 3 minutos" >&2
          exit 1
