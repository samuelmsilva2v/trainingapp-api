# Perfil "online": a API serve tambem o front compilado (npm run build no trainingapp-web), para o app inteiro
# ficar em http://localhost:8080 e poder ser exposto por um unico tunel (Tailscale Funnel, Cloudflare Tunnel).
# Use junto do dev: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,online
# Defina TRAININGAPP_WEB_URL_BASE com o endereco do tunel (os links dos e-mails apontam para ele).
trainingapp.web.pasta=../trainingapp-web/dist/trainingapp-web/browser
# Exposto por HTTPS no tunel: o cookie do login so viaja por HTTPS.
trainingapp.auth.cookie-seguro=true
server.forward-headers-strategy=native
