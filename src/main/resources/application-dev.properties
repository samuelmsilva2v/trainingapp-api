# Postgres e Mailpit locais, subidos pelo compose.yaml (spring-boot-docker-compose)
spring.docker.compose.enabled=true
server.address=127.0.0.1
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
server.forward-headers-strategy=none

# Segredo novo a cada subida: o access token dura 15 min e o front renova sozinho pelo refresh (que fica no banco).
trainingapp.auth.jwt-segredo=${random.value}${random.value}
trainingapp.auth.cookie-seguro=false
# E-mails permitidos e client id do Google ficam em dev.local.properties (fora do git), por exemplo:
#   trainingapp.auth.emails-permitidos=voce@gmail.com
#   trainingapp.auth.google-client-id=1234-abc.apps.googleusercontent.com
spring.config.import=optional:file:./dev.local.properties

# Os e-mails caem no Mailpit: http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
trainingapp.email.remetente=TrainingApp <nao-responda@trainingapp.local>
