spring.application.name=trainingapp-api
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
trainingapp.catalogo.importar=true
# Fotos do free-exercise-db, fixadas num commit para nao mudarem sozinhas.
trainingapp.catalogo.imagens-url=https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@f00c92c7dcf1216a928a52c3706c7ce8e2f71ed5/exercises

# Os padroes abaixo sao os de producao (hm e prod); dev e test sobrescrevem.
# Flyway cria o schema (db/migration) e o Hibernate so confere.
spring.jpa.hibernate.ddl-auto=validate
spring.docker.compose.enabled=false
# Atras de proxy reverso/tunel: usa X-Forwarded-For/Proto (so de proxy local ou de rede privada) para IP e HTTPS.
server.forward-headers-strategy=native

# Login. Em producao tudo vem do ambiente: TRAININGAPP_AUTH_JWT_SEGREDO (32+ caracteres), TRAININGAPP_AUTH_EMAILS_PERMITIDOS
# (separados por virgula; vazio = ninguem entra), TRAININGAPP_AUTH_GOOGLE_CLIENT_ID e TRAININGAPP_WEB_URL_BASE (links dos e-mails).
trainingapp.auth.cookie-seguro=true
trainingapp.web.url-base=http://localhost:4200

# E-mail (fila no banco + SMTP). O envio liga quando SPRING_MAIL_HOST esta definido; TRAININGAPP_EMAIL_REMETENTE e obrigatorio.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
