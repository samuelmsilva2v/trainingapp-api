# H2 em memoria, modo PostgreSQL
spring.datasource.url=jdbc:h2:mem:trainingapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# O schema do Postgres (Flyway) e conferido pelos testes *PostgresTest; no H2 o Hibernate cria as tabelas.
spring.flyway.enabled=false
spring.docker.compose.enabled=false
server.forward-headers-strategy=none
trainingapp.catalogo.importar=false
spring.jpa.properties.hibernate.generate_statistics=true

trainingapp.auth.jwt-segredo=segredo-de-teste-com-mais-de-32-caracteres
trainingapp.auth.emails-permitidos=atleta@teste.com,maria@teste.com
trainingapp.auth.google-client-id=cliente-de-teste.apps.googleusercontent.com
trainingapp.auth.google-client-secret=segredo-de-teste-do-google
trainingapp.auth.cookie-seguro=false
