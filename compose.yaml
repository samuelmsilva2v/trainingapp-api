services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1::5432'
  # Caixa de entrada falsa para os e-mails de dev (confirmar cadastro, redefinir senha): http://localhost:8025
  mailpit:
    image: 'axllent/mailpit'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
